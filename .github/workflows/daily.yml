name: Buddy 加油站每日自动化（微信通知版）

on:
  schedule:
    # GitHub cron 使用 UTC。下面三个时段对应北京时间 08:10 / 14:10 / 20:10。
    # 脚本幂等，重复触发不会重复领积分或重复派猫。
    - cron: "10 0 * * *"
    - cron: "10 6 * * *"
    - cron: "10 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wb-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 定位 Python 解释器
        id: py
        run: |
          set -euo pipefail
          PY="$(command -v python3 || command -v python || true)"
          if [ -z "$PY" ]; then
            echo "未找到可用的 Python 解释器" >&2
            exit 1
          fi
          "$PY" -c 'import sys; print("使用解释器:", sys.executable, sys.version.split()[0])'
          echo "python_path=$PY" >> "$GITHUB_OUTPUT"

      - name: 执行签到与派猫猫（微信通知）
        id: run
        env:
          WB_ACCESS_TOKEN: ${{ secrets.WB_ACCESS_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WB_ENDPOINT: https://copilot.tencent.com
          WB_RESULT_FILE: ${{ runner.temp }}/wb_result.md
        run: |
          set -uo pipefail
          PY="${{ steps.py.outputs.python_path }}"
          set +e
          "$PY" run_with_wechat.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::本轮存在未完成项，详见日志与微信通知"
          fi
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/wb_result.md
        run: |
          set -uo pipefail
          {
            echo "### Buddy 加油站每日自动化（微信通知版）"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')（cron 为 UTC）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 未产出结论文案，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 心跳提交（保持 schedule 存活）
        if: always()
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: scheduled keepalive [skip ci]"
          git push
